{const o=LS('geo')||{};Object.keys(o).forEach(k=>{if(o[k].src==='manual'&&!geo[k])geo[k]=o[k]})}

async function nm(q,n){const c=new AbortController(),to=setTimeout(()=>c.abort(),8000);try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit='+(n||3)+'&countrycodes=mx&q='+encodeURIComponent(q),{signal:c.signal})).json();netFail=0;return r}catch(e){netFail++;return[]}finally{clearTimeout(to)}}

/* --- panel de seguimiento (administrador) --- */
const wh=t=>t?new Date(t).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}):'';
async function loadPn(){try{const tk=await token();if(!tk)return;AV=await(await sb('/rest/v1/avance?select=*&order=updated_at.desc&limit=3000',{},tk)).json();AV=AV.filter(a=>a.estado);drawPn()}catch(e){$('pnm').textContent='⚠ No se pudo leer el avance: '+e.message}}
function openPn(){$('pn').hidden=false;$('pn').innerHTML='<div class="edh"><b>📊 Seguimiento</b><button data-q="close">Cerrar</button></div><p id="pnm">Cargando…</p>';loadPn();clearInterval(pnT);pnT=setInterval(()=>{if(!$('pn').hidden)loadPn()},15000)}
function drawPn(){const el=$('pn'),byK={};AV.forEach(a=>byK[a.key]=a);const emp={};AV.forEach(a=>{if(a.estado==='hecho'){const n=a.empleado||'(sin nombre)';emp[n]=(emp[n]||0)+1}});
 let TT=0,TL=0,PZ=0,PD=0,body='';
 D.rutas.forEach(ru=>{const l=ordL(ru);if(!l.length)return;if(!mainR().includes(ru)&&!l.some(s=>s.sp.some(x=>byK[phk(x)])))return;let sl=0,pd=0,pz=0,rows='';
  l.forEach(s=>{const ps=s.sp.map(x=>({x,k:phk(x),a:byK[phk(x)]})),hd=ps.every(p=>p.a&&(p.a.estado==='hecho'||p.a.estado==='no_realizado')),any=ps.some(p=>p.a),pend=ps.some(p=>p.a&&p.a.estado==='no_realizado');
   ps.forEach(p=>{pz++;if(p.a&&p.a.estado==='hecho')pd++});if(hd)sl++;
   const last=ps.reduce((m,p)=>p.a&&p.a.updated_at>m?p.a.updated_at:m,''),who=[...new Set(ps.map(p=>p.a&&p.a.empleado).filter(Boolean))].join(', '),nota=(ps.find(p=>p.a&&p.a.nota)||{a:{}}).a.nota;
   const bd=hd?(pend?'⚠':'✅'):any?'🟠':'⚪';
   rows+='<details data-c="'+esc2(s.cr)+'"'+(pnOpen.has(s.cr)?' open':'')+'><summary>'+bd+' <b>'+esc2(s.tienda)+'</b> <small>'+esc2(s.mpo)+(who?' · '+esc2(who):'')+(last?' · '+wh(last):'')+'</small></summary><div class="pzs">'
    +ps.map(p=>{const a=p.a,t=!a?'Pendiente':a.estado==='hecho'?'✅ Hecho':a.estado==='no_realizado'?'⚠ No realizado: '+esc2(a.motivo):'🟠 En proceso';
     return'<div class="pz"><b>'+esc2(p.x.marca)+' '+esc2(p.x.tipo)+' '+esc2(p.x.medida)+'</b> — '+t+(a&&(a.foto_a||a.foto_d)?'<div class="ph">'+(a.foto_a?'<figure><img class="th" data-p="'+esc2(a.foto_a)+'"><figcaption>Antes</figcaption></figure>':'')+(a.foto_d?'<figure><img class="th" data-p="'+esc2(a.foto_d)+'"><figcaption>Después</figcaption></figure>':'')+'</div>':'')+'</div>'}).join('')
    +(nota?'<div class="addr">📝 '+esc2(nota)+'</div>':'')+'</div></details>'});
  TT+=l.length;TL+=sl;PZ+=pz;PD+=pd;
  body+='<section class="er"><div class="erh"><b>'+esc2(ru)+'</b><small>'+sl+'/'+l.length+' tiendas · '+pd+'/'+pz+' piezas</small></div><div class="bar2"><i style="width:'+(l.length?100*sl/l.length:0)+'%"></i></div>'+rows+'</section>'});
 const act=AV.slice(0,6).map(a=>'<div class="addr">'+wh(a.updated_at)+' · '+esc2(a.empleado||'?')+' · '+esc2(a.tienda)+' · '+esc2(a.marca)+' '+esc2(a.tipo)+' → '+({hecho:'hecho',no_realizado:'no realizado',en_proceso:'en proceso'}[a.estado]||a.estado)+'</div>').join('');
 el.innerHTML='<div class="edh"><b>📊 Seguimiento</b><span><button data-q="rep">📥 Informe Excel</button> <button data-q="ref">↻</button> <button data-q="close">Cerrar</button></span></div>'
  +'<div class="card2"><b>'+TL+' de '+TT+' tiendas listas · '+PD+' de '+PZ+' piezas</b><div class="bar2"><i style="width:'+(TT?100*TL/TT:0)+'%"></i></div><div class="addr" id="pnm">'+(Object.keys(emp).length?'Por persona: '+Object.entries(emp).map(([n,c])=>esc2(n)+' '+c).join(' · '):'Aún nadie ha enviado avance.')+' · actualizado '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</div></div>'
  +(act?'<div class="card2"><b>Actividad reciente</b>'+act+'</div>':'')+body;loadThumbs()}
async function loadThumbs(){const tk=await token();if(!tk)return;for(const im of $('pn').querySelectorAll('details[open] img[data-p]')){const p=im.dataset.p;if(!TH[p]){try{TH[p]=URL.createObjectURL(await(await sb('/storage/v1/object/authenticated/fotos/'+p,{},tk)).blob())}catch(e){continue}}im.src=TH[p]}}
async function cloudReport(){$('pnm').textContent='Armando Excel con fotos…';const tk=await token(),byK={};D.recs.forEach(x=>byK[phk(x)]=x);
 const get=async p=>p?await(await sb('/storage/v1/object/authenticated/fotos/'+p,{},tk)).blob():null,rows=[];
 for(const a of AV){const x=byK[a.key]||a,ad=D.addr[x.cr]||{},ph=async(p,ts,w,h)=>p?{blob:await get(p),ts,w,h}:null;
  rows.push({ruta:x.ruta,cr:x.cr,tienda:x.tienda,mpo:x.mpo||ad.mpo||'',dir:AD[x.cr]!==undefined?AD[x.cr]:(ad.dir||''),marca:x.marca,tipo:x.tipo,medida:x.medida,promo:x.promo||'',done:a.estado==='hecho',skip:a.estado==='no_realizado'?(a.motivo||'Sin motivo'):'',a:await ph(a.foto_a,a.ts_a,a.w_a,a.h_a),d:await ph(a.foto_d,a.ts_d,a.w_d,a.h_d),nota:(a.nota||'')+(a.empleado?(a.nota?' | ':'')+'Empleado: '+a.empleado:'')})}
 const ordR=new Map(D.rutas.map((r,i)=>[r,i]));rows.sort((p,q)=>(ordR.get(p.ruta)??99)-(ordR.get(q.ruta)??99)||p.tienda.localeCompare(q.tienda));
 const buf=await buildReport(rows,D.rutas),d=new Date(),p2=n=>String(n).padStart(2,'0'),name='Seguimiento_Lonas_P12_'+d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+'.xlsx',a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=name;a.click();$('pnm').textContent='Excel descargado: '+name}
document.addEventListener('click',e=>{const t=e.target;
 if(t.closest&&t.closest('#pn')){const q=t.dataset.q;if(q==='close'){$('pn').hidden=true;clearInterval(pnT)}else if(q==='ref')loadPn();else if(q==='rep')cloudReport().catch(er=>{$('pnm').textContent='⚠ '+er.message});else if(t.tagName==='IMG'&&TH[t.dataset.p])window.open(TH[t.dataset.p])}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'&&d.closest('#pn')){d.open?pnOpen.add(d.dataset.c):pnOpen.delete(d.dataset.c);if(d.open)loadThumbs()}},true);
if(CLOUD){$('pnb').onclick=()=>admOk&&openPn();$('pub').onclick=()=>publish(true);
 const tick=()=>{pullCfg();flush()};setInterval(tick,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});addEventListener('online',tick);setTimeout(tick,1500)}
else{$('pnb').style.display='none';$('pub').style.display='none'}

fillBrands();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>

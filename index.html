<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Combigráfica · Recorrido Lonas P12</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<meta name="theme-color" content="#4b1778"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f4f2;--card:#fff;--tx:#1b1b1b;--mut:#666;--bd:#ddd;--ac:#d6007f;--pu:#4b1778;--ye:#ffeb00;--cy:#009fe3;--hnk:#0a7d36;--mod:#a67c00;--kof:#c8102e}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#202020;--tx:#eee;--mut:#999;--bd:#383838;--hnk:#3fbf6a;--mod:#e0b43a;--kof:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
h1{font-size:17px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:#fff}
.tabs,.tools{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0}
button,select,input[type=search]{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 10px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}button{white-space:nowrap}
.tools{padding-bottom:4px}input[type=search]{flex:1;min-width:120px}
main{padding:8px 12px 40px;max-width:720px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}
.c.ok{opacity:.55}.c.here{border-left-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
h3{margin:0;font-size:16px}h3 small{color:var(--mut);font-weight:400}
.meta,.addr{color:var(--mut);font-size:13px}.addr{margin:2px 0 6px}
.sw{margin:4px 0;border-radius:8px;background:var(--bg);border-left:4px solid var(--bd)}
.sw.Heineken{border-color:var(--hnk)}.sw.Modelo{border-color:var(--mod)}.sw.Kof{border-color:var(--kof)}
.sp{display:flex;gap:8px;align-items:flex-start;padding:7px 8px}
.ph{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 8px 8px 38px}.ph button{font-size:12px;padding:5px 8px}.th{height:54px;width:54px;object-fit:cover;border-radius:6px;border:2px solid var(--ac)}.ph small{color:var(--mut);font-size:11px}
[hidden]{display:none!important}
body.simple>header,body.simple>.tabs,body.simple>.tools,body.simple>#td,body.simple>#map,body.simple>#list{display:none!important}
body:not(.simple)>#sm{display:none}
#sm{padding:10px 12px 60px;max-width:560px;margin:auto;font-size:16px}
.big{display:block;width:100%;padding:18px 12px;font-size:19px;font-weight:700;border-radius:14px;border:0;background:var(--ac);color:#fff;margin:10px 0;text-align:center;text-decoration:none;white-space:normal}
.big small{display:block;font-weight:400;font-size:13px;opacity:.9;margin-top:2px}.big.g{background:#1f8f4a}.big.b{background:#1a73e8}.big.o{background:var(--card);color:var(--tx);border:2px solid var(--bd)}
.card2{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}.sp2{border-left:6px solid var(--bd)}.sp2.Heineken{border-color:var(--hnk)}.sp2.Modelo{border-color:var(--mod)}.sp2.Kof{border-color:var(--kof)}
.what{font-size:21px;font-weight:800;line-height:1.25}.small{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.warn{color:var(--ac);font-weight:700;margin:6px 0}.okb{background:#1f8f4a;color:#fff;font-weight:700;padding:10px;border-radius:10px;text-align:center;margin:8px 0}
.topb{display:flex;justify-content:space-between;align-items:center;gap:8px}.bar2{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0}.bar2 i{display:block;height:100%;background:#1f8f4a}
.nv{display:flex;gap:6px;align-items:center;margin:14px 0}.nv select{flex:1;min-width:0;padding:10px}.sm{padding:9px 12px}.lk{color:var(--mut);font-size:13px}#sm .ph{padding:6px 0}#sm .th{height:64px;width:64px}
#pn{position:fixed;inset:0;z-index:16;background:var(--bg);overflow:auto;padding:8px 10px 60px}#pn details{border-top:1px solid var(--bd);padding:6px 0}#pn summary{cursor:pointer}#pn summary small{color:var(--mut)}#pn .th{height:96px;width:96px}#pn figure{margin:0;text-align:center;font-size:11px}#pn .ph{padding:6px 0}.pz{padding:6px 0 6px 10px}
#cl{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:6;background:#000a;color:#fff;border-radius:14px;padding:4px 12px;font-size:12px;pointer-events:none}
#lg{position:fixed;inset:0;z-index:30;background:#000a;display:flex;align-items:center;justify-content:center}#lg form{background:var(--card);padding:16px;border-radius:12px;display:flex;flex-direction:column;gap:8px;width:min(92vw,340px)}#lg input{padding:10px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
#ed input.pos{width:56px;padding:6px 4px;text-align:center;font-weight:700;font-size:16px;box-sizing:border-box;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}#ed input.pos.chg{border-color:#e67e00;background:#fff3e0;color:#000}#ed .apos{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--mut);margin:2px 0 6px}
#ed .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 6px}#ed .chips button{padding:4px 10px;font-size:13px}#ed .chips small{color:var(--mut)}
#ed .ed1{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:8px 0}#ed .ed1 summary{font-weight:700;cursor:pointer}.pcs{margin:0 0 6px 18px;font-size:13px}.pcs summary{cursor:pointer;color:var(--mut)}.ef textarea{width:100%;margin:3px 0;padding:8px;box-sizing:border-box;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}.row2{display:flex;gap:6px}.row2 label{flex:1;font-size:12px;color:var(--mut)}
#sm .sr button{padding:10px 14px;font-size:17px}
#ed{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:8px 10px 60px}
.edh{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;z-index:2}
.er{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:10px 0}.erh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.erh b{font-size:16px}.erh small{color:var(--mut)}.eb{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.sr{display:flex;gap:4px;align-items:center;padding:5px 0;border-top:1px solid var(--bd)}.sn{flex:1;min-width:0;font-size:13px}.sn small{color:var(--mut)}
.sr button,.sr select,.erh button,.edh button{padding:5px 8px;font-size:13px}.sr select{max-width:96px}
.ef{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}.ef input,.ef select{width:100%;margin:3px 0;padding:8px;box-sizing:border-box}
#ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}#ov img{max-width:100%;max-height:75vh;border-radius:6px}
.sp input{width:22px;height:22px;margin:0;flex:none}.sp b{font-size:15px}
.tag{background:#555;font-size:11px;padding:1px 6px;border-radius:9px;color:#fff;margin-left:4px}.tag.Heineken{background:var(--hnk)}.tag.Modelo{background:var(--mod)}.tag.Kof{background:var(--kof)}
.vg{font-size:12px;color:var(--mut)}.vg.warn{color:var(--ac);font-weight:600}
details{font-size:12px;color:var(--mut);margin-top:2px}details.hc{color:var(--tx);margin-top:4px}
.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.act button,.act a{font-size:13px;padding:6px 10px;text-decoration:none}
a.nav{background:var(--ac);color:#fff;border-radius:8px}
textarea{width:100%;margin-top:6px;font:inherit;font-size:13px;border:1px solid var(--bd);border-radius:8px;padding:6px;background:var(--card);color:var(--tx);resize:vertical}
#st{font-size:12px;padding:0 12px;color:var(--mut)}
#map{height:68vh;min-height:340px;margin:8px 12px;border-radius:10px;border:1px solid var(--bd)}
.pin{width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font:700 12px/22px system-ui;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px #0006}.pin.ok{background:#777}.pin.ap{background:#e08a00}
.pp{font:13px/1.35 system-ui;min-width:170px}.pp a{display:inline-block;margin:6px 6px 0 0;padding:5px 9px;border-radius:7px;background:var(--ac);color:#fff;text-decoration:none}.pp button{margin-top:6px;font-size:13px;padding:4px 8px}
.td{margin:8px 12px;padding:8px 10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;font-size:13px}.td p{margin:6px 0}.td a.nav{display:inline-block;border-radius:8px;color:#fff}

/* ---- identidad Combigráfica ---- */
body{font-family:"Trebuchet MS",system-ui,sans-serif}
header{background:linear-gradient(120deg,#4b1778 0%,#5d1a93 55%,#d6007f 130%);border-bottom:4px solid var(--ye)}
header h1{align-items:center}header .wm{height:24px;width:auto;display:block}header .sub{font-size:12px;opacity:.9;font-weight:700;letter-spacing:.03em}
.bar{background:rgba(255,255,255,.25)}.bar i{background:var(--ye)}
button.on{background:var(--ac);border-color:var(--ac);font-weight:700}
.big{background:var(--ac);box-shadow:0 4px 0 #8a0050;font-weight:900;letter-spacing:.01em;text-transform:none}.big:active{transform:translateY(2px);box-shadow:0 2px 0 #8a0050}
.big.g{background:var(--cy);box-shadow:0 4px 0 #006da3}.big.o{background:var(--card);box-shadow:0 3px 0 var(--bd)}
.bar2 i{background:linear-gradient(90deg,var(--ac),var(--ye))}.bar2{height:10px}
.what{color:var(--pu)}@media(prefers-color-scheme:dark){.what{color:#f2d4ff}}
.card2{border-top:4px solid var(--ye)}
#sbr{display:none;position:sticky;top:0;z-index:7;background:linear-gradient(120deg,#4b1778,#5d1a93 60%,#d6007f 140%);border-bottom:4px solid var(--ye);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;align-items:center;justify-content:center}
#sbr img{height:22px;width:auto}body.simple #sbr{display:flex}
.hero{text-align:center;margin:4px 0 8px}.hero img{width:46%;max-width:190px;height:auto;display:block;margin:0 auto}.hero h2{margin:4px 0 0;color:var(--pu);font-size:22px;font-weight:900}@media(prefers-color-scheme:dark){.hero h2{color:#f2d4ff}}
.hero small{display:block;color:var(--mut);font-weight:700}

:root{--ol:#2e0b52;--sh:#2e0b52;--pk:#d6007f}
@media(prefers-color-scheme:dark){:root{--ol:#c79bff;--sh:#000;--bg:#18102a;--card:#241a3a;--bd:#3d2f5c;--mut:#b2a5cc}}
body{background-color:var(--bg);background-image:radial-gradient(rgba(75,23,120,.09) 1.4px,transparent 1.7px);background-size:15px 15px}
@media(prefers-color-scheme:dark){body{background-image:radial-gradient(rgba(199,155,255,.10) 1.4px,transparent 1.7px)}}
header,#sbr{background-image:radial-gradient(rgba(255,255,255,.14) 1.5px,transparent 2px),linear-gradient(120deg,#3b0f63 0%,#5d1a93 55%,#d6007f 130%);background-size:11px 11px,auto}
header h1,.what,.hero h2,.big,.topb b,.chip-t{font-family:PopB,"Trebuchet MS",system-ui,sans-serif}
.tabs button,.tools button{border:2px solid var(--ol);border-radius:11px;box-shadow:0 2px 0 var(--sh);font-weight:700}
.tabs button.on{background:var(--pk);color:#fff;box-shadow:0 2px 0 var(--sh)}
.hero{position:relative;margin:-10px -12px 14px;padding:20px 10px 16px;background:linear-gradient(160deg,#3b0f63,#5d1a93);overflow:hidden;border-bottom:5px solid var(--ye);border-radius:0 0 30px 30px;text-align:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 12%,var(--pk) 0 64px,transparent 65px),radial-gradient(circle at 6% 96%,var(--cy) 0 58px,transparent 59px),radial-gradient(circle at 72% 100%,var(--ye) 0 26px,transparent 27px),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2px) 0 0/11px 11px}
.hero img{position:relative;width:42%;max-width:170px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.hero h2{position:relative;margin:6px 0 0;color:var(--ye);font-size:27px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;text-shadow:3px 3px 0 var(--pk),5px 5px 0 rgba(0,0,0,.25)}
.hero h2 small{display:block;color:#fff;font-size:13px;letter-spacing:.14em;text-shadow:none;margin-top:6px}
#sm p{font-weight:700}
.big{border:3px solid var(--ol);box-shadow:0 5px 0 var(--sh);border-radius:16px;font-size:20px;background:var(--pk)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sh)}
.big.g{background:var(--cy);box-shadow:0 5px 0 var(--sh)}.big.o{background:var(--card);color:var(--tx);box-shadow:0 5px 0 var(--sh)}
.big.rt{display:block;text-align:left;padding:14px 16px;font-size:24px;letter-spacing:.02em;position:relative;overflow:hidden}
.big.rt small{font-family:system-ui,sans-serif;font-size:13px;font-weight:700;opacity:1;margin-top:6px}
.big.rt .pb{display:block;height:10px;border-radius:6px;background:rgba(255,255,255,.35);margin-top:8px;overflow:hidden;border:2px solid rgba(0,0,0,.25)}.big.rt .pb b{display:block;height:100%;background:var(--ye)}
.big.rt::after{content:"▶";position:absolute;right:14px;top:14px;font-size:22px;opacity:.9}
.big.rc1{background:var(--cy)}.big.rc2{background:var(--ye);color:#2e0b52}.big.rc2 .pb{background:rgba(46,11,82,.2)}.big.rc2 .pb b{background:var(--pk)}.big.rc3{background:#6a2bb0}
.card2{background:var(--card);border:3px solid var(--ol);border-top-width:3px;border-radius:18px;box-shadow:5px 5px 0 var(--sh)}
.card2.sp2{border-left-width:10px}.card2.sp2.Heineken{border-color:var(--ol);border-left-color:var(--hnk)}.card2.sp2.Modelo{border-color:var(--ol);border-left-color:var(--mod)}.card2.sp2.Kof{border-color:var(--ol);border-left-color:var(--kof)}
.what{font-weight:700;font-size:22px}
.small{font-weight:700;color:var(--pk)}
.topb b{background:var(--pk);color:#fff;border-radius:20px;padding:5px 16px;font-size:16px;letter-spacing:.04em;border:2px solid var(--ol);box-shadow:0 3px 0 var(--sh)}
.topb .sm{border:2px solid var(--ol);box-shadow:0 3px 0 var(--sh);border-radius:12px;font-weight:700}.topb span{font-family:PopB,system-ui;font-size:17px}
.bar2{height:16px;border:2px solid var(--ol);border-radius:10px;background:var(--card)}.bar2 i{background:repeating-linear-gradient(135deg,var(--pk) 0 10px,#ff4fb1 10px 20px);border-radius:0 8px 8px 0}

async function delEmp(id,n){if(!confirm('¿Eliminar a '+n+'?\n\nPerderá el acceso en su celular y tendrá que registrarse de nuevo si vuelve a entrar. Lo que ya envió se conserva.'))return;

 try{const v0=(await(await sb('/rest/v1/config?id=eq.1&select=version')).json())[0];if(!v0||String(v0.version)===String(LS('cfgv')||''))return;const r=await(await sb('/rest/v1/config?id=eq.1&select=data,version')).json(),c=r[0];if(!c)return;applyCfg(c.data);SV('cfgv',c.version);

 Object.keys(geo).forEach(k=>{if(geo[k].src==='manual')delete geo[k]});Object.assign(geo,c.geo||{});SV('geo2',geo);
 if(!D.rutas.includes(route))route=D.rutas[0];if(sRoute&&!mainR().includes(sRoute)){sRoute=null;SV('sroute',null)}sCur=null;fitNext=true}

async function publish(manual){if(!CLOUD||!admOk)return;try{const tk=await token();if(!tk)throw new Error('Inicia sesión como administrador');
 const v=Date.now(),mg={};Object.keys(geo).forEach(k=>{if(geo[k].src==='manual')mg[k]=geo[k]});
 await sb('/rest/v1/config?on_conflict=id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:1,version:v,updated_at:new Date().toISOString(),data:{base:D,plan:P,ad:AD,geo:mg,reset:LS('reset')||0,resetR:LS('resetR')||{}}})},tk);

 catch(e){$('st').textContent='⚠ No se pudo publicar: '+e.message}}

async function wipeProgress(){SV('ow',{});OA={};done={};skip={};notes={};['done','skip','notes'].forEach(k=>SV(k,{}));SV('sent',{});SV('upl',{});Object.keys(PH).forEach(k=>{try{URL.revokeObjectURL(PH[k].url)}catch(e){}delete PH[k]});
 try{const db=await DB;await new Promise((ok,no)=>{const t=db.transaction('f','readwrite');t.objectStore('f').clear();t.oncomplete=ok;t.onerror=()=>no(t.error)})}catch(e){}sCur=null}
async function wipeRoute(ru){const rs=D.recs.filter(r=>r.ruta===ru),sent=LS('sent')||{},upl=LS('upl')||{};
 for(const r of rs){delete done[r.id];const k=phk(r);delete skip[k];delete sent[k];for(const s of['a','d']){const q=k+'|'+s;if(PH[q]){try{URL.revokeObjectURL(PH[q].url)}catch(e){}delete PH[q];try{await dbSet(q,null)}catch(e){}}delete upl[q]}}
 const keep=new Set(D.recs.filter(r=>r.ruta!==ru).map(r=>r.cr));rs.forEach(r=>{if(!keep.has(r.cr))delete notes[r.cr]});
 SV('done',done);SV('skip',skip);SV('notes',notes);SV('sent',sent);SV('upl',upl);sCur=null}

 for(let i=0;i<paths.length;i+=100)await sb('/storage/v1/object/fotos',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefixes:paths.slice(i,i+100)})},tk);
 await sb('/rest/v1/avance?ruta=eq.'+encodeURIComponent(ru),{method:'DELETE'},tk);
 const rr=LS('resetR')||{};rr[ru]=Date.now();SV('resetR',rr);await wipeRoute(ru);await publish()}
async function cloudReset(){const tk=await token();if(!tk)throw new Error('Inicia sesión como administrador');

 for(const r of rows){try{const l=await(await sb('/storage/v1/object/list/fotos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefix:safeK(r.key),limit:100})},tk)).json();l.forEach(f=>paths.push(safeK(r.key)+'/'+f.name))}catch(e){}}

const wh=t=>t?new Date(t).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}):'';
async function loadPn(){try{const tk=await token();if(!tk)return;AV=await(await sb('/rest/v1/avance?select=*&order=updated_at.desc&limit=3000',{},tk)).json();AV=AV.filter(a=>a.estado);try{EM=await(await sb('/rest/v1/empleados?select=*&order=ultima_conexion.desc',{},tk)).json()}catch(e){EM=null}drawPn()}catch(e){$('pnm').textContent='⚠ No se pudo leer el avance: '+e.message}}

function drawPn(){const el=$('pn'),byK={};AV.forEach(a=>byK[a.key]=a);const emp={};AV.forEach(a=>{if(a.estado==='hecho'){const n=a.empleado||'(sin nombre)';emp[n]=(emp[n]||0)+1}});

 D.rutas.forEach(ru=>{const l=ordL(ru);if(!l.length)return;if(!mainR().includes(ru)&&!l.some(s=>s.sp.some(x=>byK[phk(x)])))return;let sl=0,pd=0,pz=0,rows='';
  l.forEach(s=>{const ps=s.sp.map(x=>({x,k:phk(x),a:byK[phk(x)]})),hd=ps.every(p=>p.a&&(p.a.estado==='hecho'||p.a.estado==='no_realizado')),any=ps.some(p=>p.a),pend=ps.some(p=>p.a&&p.a.estado==='no_realizado');

   const last=ps.reduce((m,p)=>p.a&&p.a.updated_at>m?p.a.updated_at:m,''),who=[...new Set(ps.map(p=>p.a&&p.a.empleado).filter(Boolean))].join(', '),nota=(ps.find(p=>p.a&&p.a.nota)||{a:{}}).a.nota;
   const bd=hd?(pend?'⚠':'✅'):any?'🟠':'⚪';
   rows+='<details data-c="'+esc2(s.cr)+'"'+(pnOpen.has(s.cr)?' open':'')+'><summary>'+bd+' <b>'+esc2(s.tienda)+'</b> <small>'+esc2(s.mpo)+(who?' · '+esc2(who):'')+(last?' · '+wh(last):'')+'</small></summary><div class="pzs">'
    +ps.map(p=>{const a=p.a,t=!a?'Pendiente':a.estado==='hecho'?'✅ Hecho':a.estado==='no_realizado'?'⚠ No realizado: '+esc2(a.motivo):'🟠 En proceso';
     return'<div class="pz"><b>'+esc2(p.x.marca)+' '+esc2(p.x.tipo)+' '+esc2(p.x.medida)+'</b> — '+t+(a&&(a.foto_a||a.foto_d)?'<div class="ph">'+(a.foto_a?'<figure><img class="th" data-p="'+esc2(a.foto_a)+'"><figcaption>Antes</figcaption></figure>':'')+(a.foto_d?'<figure><img class="th" data-p="'+esc2(a.foto_d)+'"><figcaption>Después</figcaption></figure>':'')+'</div>':'')+'</div>'}).join('')
    +(nota?'<div class="addr">📝 '+esc2(nota)+'</div>':'')+'</div></details>'});
  TT+=l.length;TL+=sl;PZ+=pz;PD+=pd;
  body+='<section class="er"><div class="erh"><b>'+esc2(ru)+'</b><small>'+sl+'/'+l.length+' tiendas · '+pd+'/'+pz+' piezas</small><span class="eb"><button data-q="rrep" data-r="'+esc2(ru)+'">📥 Excel</button><button data-q="rres" data-r="'+esc2(ru)+'">🗑 Reiniciar</button></span></div><div class="bar2"><i style="width:'+(l.length?100*sl/l.length:0)+'%"></i></div>'+rows+'</section>'});
 const act=AV.slice(0,6).map(a=>'<div class="addr">'+wh(a.updated_at)+' · '+esc2(a.empleado||'?')+' · '+esc2(a.tienda)+' · '+esc2(a.marca)+' '+esc2(a.tipo)+' → '+({hecho:'hecho',no_realizado:'no realizado',en_proceso:'en proceso'}[a.estado]||a.estado)+'</div>').join('');
 el.innerHTML='<div class="edh"><b>📊 Seguimiento</b><span><button data-q="rep">📥 Informe Excel</button> <button data-q="ref">↻</button> <button data-q="close">Cerrar</button></span></div>'
  +'<div class="card2"><b>'+TL+' de '+TT+' tiendas listas · '+PD+' de '+PZ+' piezas</b><div class="bar2"><i style="width:'+(TT?100*TL/TT:0)+'%"></i></div><div class="addr" id="pnm">'+(Object.keys(emp).length?'Por persona: '+Object.entries(emp).map(([n,c])=>esc2(n)+' '+c).join(' · '):'Aún nadie ha enviado avance.')+' · actualizado '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</div></div>'
  +'<div class="card2"><b>👥 Empleados'+(EM?' ('+EM.length+')':'')+'</b>'+(EM===null?'<div class="addr">⚠ Falta crear la tabla de empleados en Supabase (ver GUIA_NUBE.md).</div>':EM.length?EM.map(m=>{const on=Date.now()-new Date(m.ultima_conexion).getTime()<120000;return'<div class="sr"><span class="sn">'+(on?'🟢':'⚪')+' <b>'+esc2(m.nombre)+'</b> <small>'+(on?'conectado ahora':'visto '+wh(m.ultima_conexion))+' · '+(emp[m.nombre]||0)+' piezas hechas</small></span><button data-q="edel" data-id="'+esc2(m.id)+'" data-n="'+esc2(m.nombre)+'">🗑 Eliminar</button></div>'}).join(''):'<div class="addr">Nadie se ha conectado todavía.</div>')+'</div>'
  +(act?'<div class="card2"><b>Actividad reciente</b>'+act+'</div>':'')+body;loadThumbs()}
async function loadThumbs(){const tk=await token();if(!tk)return;for(const im of $('pn').querySelectorAll('details[open] img[data-p]')){const p=im.dataset.p;if(!TH[p]){try{TH[p]=URL.createObjectURL(await(await sb('/storage/v1/object/authenticated/fotos/'+p,{},tk)).blob())}catch(e){continue}}im.src=TH[p]}}

 const buf=await buildReport(rows,D.rutas),d=new Date(),p2=n=>String(n).padStart(2,'0'),name='Seguimiento_'+(ru?ru.replace(/[^A-Za-z0-9_-]+/g,'_')+'_':'Lonas_P12_')+d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+'.xlsx',a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=name;a.click();$('pnm').textContent='Excel descargado: '+name}
